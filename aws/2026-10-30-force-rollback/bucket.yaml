AWSTemplateFormatVersion: '2010-09-09'
Description: Tried It First - bucket dove aws cloudformation package carica il template annidato.

Resources:
  Modelli:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

Outputs:
  Bucket:
    Value: !Ref Modelli

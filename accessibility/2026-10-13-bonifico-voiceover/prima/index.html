<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bonifico</title>
<link rel="stylesheet" href="../stile.css">
</head>
<body>
<div class="app">
  <div class="barra">
    <div class="icona" onclick="history.back()">
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    </div>
    <div class="titolo">Nuovo bonifico</div>
    <button class="icona">
      <svg viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5V14M12 17h.01" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    </button>
  </div>

  <div class="campo">
    <input type="text" placeholder="Beneficiario">
  </div>
  <div class="campo">
    <input type="text" placeholder="IBAN" value="IT60X0542811101000000123456">
  </div>
  <div class="campo">
    <input type="text" placeholder="Importo" value="1.000,00" class="errore">
  </div>
  <div class="campo">
    <input type="text" placeholder="Causale">
  </div>

  <div class="riga">
    <span class="tenue">Salva tra i beneficiari</span>
    <div class="interruttore" onclick="this.classList.toggle('acceso')"></div>
  </div>

  <div class="tenue piccolo">Commissione 0,00 €. Disponibile 850,00 €.</div>

  <div class="bottone disattivo">Continua</div>
</div>
</body>
</html>
